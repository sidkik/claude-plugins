name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Node tests
        run: node --test tests/*.test.mjs sdlc-process/tests/*.test.mjs sdlc-status/tests/*.test.mjs
      - name: Process bundle tests
        run: python3 -m unittest discover -s tests -p 'process*.py' -v
